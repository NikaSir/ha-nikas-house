[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-nikas-house"
version = "0.1.0"
description = "Autonomous NikaS House dashboard integration for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
ha-nikas-house = "generator.entrypoint:main"

[tool.setuptools.packages.find]
include = ["generator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
